name: Windows test build

# Trial build of a branch for Windows x64, before opening a pull request: the NSIS installer
# and the portable exe as a workflow artifact. Unsigned, without updater artifacts.
on:
  push:
    branches: ["test/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP "no-updater.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Out-File -Encoding ascii $config
          pnpm tauri build --bundles nsis --config $config
      - name: Portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/openidea.exe portable/
          if (Test-Path target/release/WebView2Loader.dll) { Copy-Item target/release/WebView2Loader.dll portable/ }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIDEA-windows-x64-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIDEA-windows-x64-portable
          path: portable/
          if-no-files-found: error
